<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#020617}
*{box-sizing:border-box}
.sb{width:264px;flex:0 0 auto;max-width:100%}
.sb.c{width:76px}
.sb.c .lbl,.sb.c .full{display:none}
.sb.c .nav{justify-content:center;padding:0}
.sb.c .brand{justify-content:center}
.sb:not(.c) .mini{display:none}
.nav{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:8px;color:#94a3b8;text-decoration:none;font-size:14px;font-weight:500}
.nav:hover{background:#0f172a;color:#e2e8f0}
.nav.on{background:rgba(79,70,229,.18);color:#c7d2fe}
.seg{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:#94a3b8;font:500 12px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.seg:hover{color:#e2e8f0}
.seg.on{background:#4f46e5;color:#fff}
.icobtn{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;border:1px solid #1e293b;background:#0f172a;color:#cbd5e1;cursor:pointer}
.icobtn:hover{background:#1e293b;color:#fff}
.btn-p{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font:600 14px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.btn-p:hover{background:#4338ca}
.btn-g{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:8px;border:1px solid #334155;background:transparent;color:#e2e8f0;font:500 13px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.btn-g:hover{background:#1e293b;border-color:#475569}
.btn-i{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:8px;border:1px solid #4f46e5;background:rgba(79,70,229,.14);color:#c7d2fe;font:600 13px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.btn-i:hover{background:rgba(79,70,229,.28)}
.btn-i.done{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.12);color:#34d399;cursor:default}
.bd{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font:500 12px 'JetBrains Mono',ui-monospace,monospace;white-space:nowrap}
.bd.g{background:rgba(16,185,129,.12);color:#34d399;border:1px solid rgba(16,185,129,.3)}
.bd.a{background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.3)}
.bd.r{background:rgba(244,63,94,.12);color:#fb7185;border:1px solid rgba(244,63,94,.3)}
.bd.i{background:rgba(99,102,241,.14);color:#a5b4fc;border:1px solid rgba(99,102,241,.35)}
.bd.s{background:rgba(56,189,248,.12);color:#7dd3fc;border:1px solid rgba(56,189,248,.32)}
.card{background:#0f172a;border:1px solid #1e293b;border-radius:12px}
.cap{font:500 11px 'JetBrains Mono',monospace;color:#94a3b8;letter-spacing:.08em;text-transform:uppercase}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:6px;background:#020617;border:1px solid #334155;color:#c7d2fe;font:500 12px 'JetBrains Mono',monospace}
.acc-h{width:100%;display:flex;align-items:center;gap:12px;padding:14px 20px;border:0;background:transparent;color:#e2e8f0;font:600 14px Inter,system-ui,sans-serif;text-align:left;cursor:pointer}
.acc-h:hover{background:#111c33}
.chev{transition:transform .2s;color:#94a3b8;flex:0 0 auto}
.chev.open{transform:rotate(180deg)}
.editor{width:100%;min-height:400px;resize:vertical;padding:24px 28px;border:0;outline:0;background:#020617;color:#e2e8f0;font:400 16px/1.85 Inter,system-ui,sans-serif}
.tab{display:flex;align-items:center;gap:8px;height:44px;padding:0 4px;margin-right:20px;border:0;border-bottom:2px solid transparent;background:transparent;color:#94a3b8;font:500 14px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.tab:hover{color:#e2e8f0}
.tab.on{color:#f8fafc;border-bottom-color:#6366f1}
.err{display:inline;margin:0 1px;padding:2px 5px;border:0;border-radius:5px;background:rgba(244,63,94,.2);font:inherit;color:inherit;cursor:pointer}
.err:hover{background:rgba(244,63,94,.32)}
.err.sel{outline:2px solid #818cf8;outline-offset:1px}
.err s{color:#fda4af;text-decoration-thickness:1.5px}
.err b{color:#34d399;font-weight:600;margin-left:6px}
.vcard{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:12px;background:#020617;border:1px solid #1e293b}
.alt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vt{display:flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border:0;border-radius:7px;background:transparent;color:#94a3b8;font:500 13px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.vt:hover{color:#e2e8f0}
.vt.on{background:#4f46e5;color:#fff}
.wave{display:flex;align-items:center;justify-content:center;gap:4px}
.wave i{display:block;width:4px;height:100%;border-radius:2px;background:#818cf8;transform:scaleY(.2);animation:wv 1.1s ease-in-out infinite}
.wave i:nth-child(3n){animation-delay:-.3s}
.wave i:nth-child(3n+1){animation-delay:-.7s;height:70%}
.wave i:nth-child(5n){animation-delay:-.5s;height:45%}
.wave i:nth-child(7n){animation-delay:-.9s;height:90%}
.wave.rose i{background:#fb7185}
@keyframes wv{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.mic{position:relative;width:72px;height:72px;border-radius:50%;border:0;background:#e11d48;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.mic:hover{background:#be123c}
.mic::before,.mic::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #fb7185;animation:pl 2s ease-out infinite;pointer-events:none}
.mic::after{animation-delay:-1s}
@keyframes pl{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.livedot{width:8px;height:8px;border-radius:50%;background:#34d399;display:block;animation:bl 1.4s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.wave i,.mic::before,.mic::after,.livedot{animation:none}.wave i{transform:scaleY(.6)}}
.sw{display:inline-flex;gap:2px;padding:3px;border-radius:9px;background:#0f172a;border:1px solid #1e293b}
.sw a{display:flex;align-items:center;gap:8px;height:34px;padding:0 16px;border-radius:6px;color:#94a3b8;font:500 13px Inter,system-ui,sans-serif;text-decoration:none;white-space:nowrap}
.sw a:hover{color:#e2e8f0}
.sw a.on{background:#4f46e5;color:#fff}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const view = s.view || 'result';
    const evalErr = s.evalErr || null;
    const collapsed = !!s.collapsed;
    const go = v => () => this.setState({ view: v, evalErr: null, confirmNew: false });
    const VIEWS = [['ready', 'Ready'], ['recording', 'Recording'], ['recorded', 'Recorded'], ['short', 'Short'], ['grading', 'Grading'], ['result', 'Result'], ['blocked', 'Mic blocked']];
    const ERRS = [[null, 'None'], ['nospeech', 'No speech'], ['unreadable', 'Unreadable'], ['ratelimit', 'Rate limit']];
    return {
      sbCls: collapsed ? 'c' : '',
      toggle: () => this.setState({ collapsed: !collapsed }),
      views: VIEWS.map(([k, label]) => ({ label, on: view === k, cls: view === k ? 'on' : '', pick: go(k) })),
      errs: ERRS.map(([k, label]) => ({ label, on: evalErr === k, cls: evalErr === k ? 'on' : '', pick: () => this.setState({ evalErr: k }) })),
      isRecorded: view === 'recorded'
    };
  }
}
</script>
